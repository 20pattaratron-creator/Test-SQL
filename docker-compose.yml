services:
  mysql:
    image: mysql:8.4
    container_name: data-insight-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: data_insight_demo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/mysql_schema_sample.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
volumes:
  mysql_data:
